 <form id="voteForm">
        <label for="colorBlack">Black</label>

        <input type="radio" name="color" id="colorRed" value="red">

        <input type="radio" name="color" id="colorPink" value="pink">

<div id="results">
    <h2> Vote results</h2>
    <div id="chartContainer">

    </div>
</div>

<script>
// 1. The list of all colors we allow voting for.
const colors = ['black', 'white', 'blue', 'green', 'red', 'pink'];

// 2. READ from the notebook (localStorage).
function getVotes() {
    const stored = localStorage.getItem('colorVotes');
    if (stored) {
        return JSON.parse(stored);
    } else {
        const initial = {};
        colors.forEach(c => initial[c] = 0);
        return initial;
    }
}

// 3. WRITE to the notebook (localStorage).
function saveVotes(votes) {
    localStorage.setItem('colorVotes', JSON.stringify(votes));
}

// 4. DRAW the bars on the screen.
function renderResults() {
    const votes = getVotes();
    const container = document.getElementById('chartContainer');

    let total = 0;
    colors.forEach(c => total += votes[c]);

    if (total === 0) {
        container.innerHTML = '<p style="color: #888; font-style: italic;">No votes cast yet. Be the first!</p>';
        return;
    }

    let html = '';
    colors.forEach(color => {
        const count = votes[color];
        const percent = Math.max((count / total) * 100, 1);
        const displayName = color.charAt(0).toUpperCase() + color.slice(1);

        html += `
            <div class="bar-row">
                <span class="bar-label">${displayName}</span>
                <div class="bar-track">
                    <div class="bar-fill ${color}" style="width: ${percent}%;"></div>
                </div>
                <span class="bar-votes">${count}</span>
            </div>
        `;
    });

    html += `<p style="margin-top: 15px; color: #aaa;">Total votes: ${total}</p>`;
    container.innerHTML = html;
}

// 5. WAIT for the user to click "Send Vote".
document.getElementById('voteForm').addEventListener('submit', function(e) {
    // Step A: Stop the page from refreshing.
    e.preventDefault();

    // Step B: Find which radio button is selected.
    const selected = document.querySelector('input[name="color"]:checked');

    // Step C: If nothing is selected, yell at the user and stop.
    if (!selected) {
        alert('Please select a color first!');
        return;
    }

    // Step D: Read the ticket (get the color name, e.g., "blue").
    const color = selected.value;

    // Step E: Get the current scoreboard from the notebook.
    const votes = getVotes();

    // Step F: Add 1 to the score for that specific color.
    votes[color] += 1;

    // Step G: Save the updated scoreboard back to the notebook.
    saveVotes(votes);

    // Step H: Redraw the chart on the screen.
    renderResults();

    // Step I: Uncheck the radio button so the user can vote again.
    selected.checked = false;
});

// 6. START the app: Draw the chart when the page first loads.
renderResults();
</script>
